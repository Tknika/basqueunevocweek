- name: Begoña Pedrosa
  group: conference
  photo: images/speakers/begona-pedrosa.jpg
  role: Minister of Education, Department of Education, Basque Government
  bio: Minister of Education of the Basque Government since June 2024, and previously Viceminister of Education and Dean of the Faculty of Humanities and Education Sciences of Mondragon University. Holds a degree in English Philology, a PhD in Applied Linguistics (Doctor Europeus) from UPV-EHU, a Master of Arts from the University of Illinois and an MBA from Mondragon University.
- name: Anna Banczyk
  group: conference
  role: Head of Unit for Vocational Education and Training, Skills Portability and Cedefop, DG Employment, Social Affairs and Inclusion, European Commission
- name: Elina Pylkkänen
  group: conference
  role: Under-Secretary of State at the Ministry of Economic Affairs and Employment in Finland
  bio: Holds a doctoral degree in economics and has worked in international and domestic roles as a researcher, economist, economic policy specialist and director of a research institute.
- name: Georgios Zisimos
  group: conference
  role: Head of Human Capital Development Policy Advice Unit, European Training Foundation (ETF)
  bio: An educationist who has held various positions in education and training, including member of the cabinet of the EU Commissioner in charge of education, youth, culture, multilingualism and sport.
- name: Inge Gorostiaga
  group: conference
  photo: images/speakers/inge-gorostiaga.jpg
  role: Director of Digital Transformation and Advanced Learning, Department of Education, Basque Government
  bio: Holds a Bachelor’s Degree in Business Administration and Management from the UPV (Sarriko) and a Diploma in Teaching, specializing in English, from the BAM University School of Teacher Training.
- name: El Iza Mohamedou
  group: conference
  role: Head of the Centre for Skills, OECD
  bio: Leads the OECD centre that supports countries in achieving better economic and social outcomes through a whole-of-government approach to skills policies. More than 30 years of international experience, with a PhD in Economics, an MBA in International Business and a BA in Economics.
- name: Alessandro Marini
  group: conference
  role: Cluster Manager, AFIL - Lombardy Intelligent Factory Association
  bio: Also President of Brescia Mobilità, CEO and Partner of SMH Group, Partner at Studio Maruggi and Managing Partner of Quantra. Holds a Master’s degree in Mechanical Engineering and a PhD in Information Engineering from the University of Brescia, where he is a lecturer in digital.
- name: Klaus-Dieter Rupp
  group: conference
  role: Professor, Duale Hochschule Baden-Württemberg
  bio: Professor of industrial engineering since 2000 and winner of the Baden-Württemberg State Teaching Prize in 2011. Focuses on automation and robotics, research programmes and curriculum development at DHBW-Heidenheim.
- name: Richard Gale
  group: moderator
  role: Director of Camosun Innovates, Camosun College, Canada
  bio: Leads an advanced manufacturing team supporting applied research for Western Canada and beyond, and co-leads the WFCP Applied Research Affinity Group. Former Vice President Academic, Provost and Acting President of Capilano University.
- name: Kenneth Barrientos
  group: panellist
  role: Head of the UNEVOC Network Secretariat
  bio: Leads the SDGs and Greening TVET thematic programme of UNESCO-UNEVOC. Joined UNEVOC in 2013 and has worked in education, environment and TVET for over 25 years.
- name: Cynthia Woolderink
  group: panellist
  role: Chairperson of EBBD
  bio: Coordinator of international studies and international affairs at Rijn IJssel, a regional VET centre in Arnhem. Chairperson since 2021 of EBBD, the European association in charge of the joint European EBBD certificate.
- name: Daniel Kehl
  group: panellist
  role: Principal of GBS St. Gallen
