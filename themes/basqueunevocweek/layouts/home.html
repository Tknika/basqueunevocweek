{{ define "main" }}
<section class="relative isolate overflow-hidden bg-azure text-white">
  {{ partial "folds.html" . }}
  <div class="container-site py-14 md:py-20">
    <p class="tape">Save the date</p>
    <h1 class="mt-8 max-w-4xl text-6xl leading-none sm:text-7xl lg:text-8xl">{{ site.Title }}</h1>
    <p class="mt-6 max-w-2xl font-display text-2xl leading-snug sm:text-3xl">{{ site.Params.tagline }}</p>
    <p class="pill mt-10">{{ site.Params.dates }}</p>
    <p class="mt-6 flex items-center gap-3 font-display text-xl">
      <svg viewBox="0 0 24 24" class="size-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M12 22s7-7.2 7-12.5a7 7 0 1 0-14 0C5 14.8 12 22 12 22Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      {{ site.Params.venue }}
    </p>
  </div>
</section>

<div class="container-site py-14 md:py-20">
  <div class="prose-site">{{ .Content }}</div>
  <nav class="mt-10" aria-label="Sections">
    <ul class="grid gap-4 sm:grid-cols-2">
      {{ range site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="group flex h-full items-center justify-between gap-4 rounded-xl bg-mist px-6 py-6 font-display text-2xl font-semibold transition hover:bg-azure hover:text-white">
            {{ .Name }}
            <span aria-hidden="true" class="transition group-hover:translate-x-1 motion-reduce:transition-none">→</span>
          </a>
        </li>
      {{ end }}
    </ul>
  </nav>
</div>
{{ end }}
