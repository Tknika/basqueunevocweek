<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
{{ $desc := .Description | default site.Params.description | plainify | truncate 160 }}
<meta name="description" content="{{ $desc }}">
<meta name="theme-color" content="#f6f1e7">
{{ if site.Params.noindex }}<meta name="robots" content="noindex">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
{{ end }}

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:locale" content="{{ site.Language.Lang }}">

<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="preload" href="{{ "fonts/fraunces-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{ partial "css.html" . }}
