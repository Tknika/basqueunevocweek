<footer class="bg-azure text-white">
  <div class="{{ if .IsHome }}container-wide{{ else }}container-site{{ end }} py-12 md:py-16">
    <ul class="flex flex-wrap items-center justify-center gap-x-12 gap-y-8 lg:gap-x-16" aria-label="Organised by">
      {{ range $o := site.Params.organizers }}
        <li>
          <a href="{{ $o.url }}" rel="noopener" class="block">
            {{ with $o.logo }}<img src="{{ . | relURL }}" alt="{{ $o.name }}" class="{{ if $o.plaque }}h-28 bg-white p-2 sm:h-32{{ else }}h-16 sm:h-20{{ end }} w-auto max-w-full">{{ else }}<span class="font-display text-lg font-semibold">{{ $o.name }}</span>{{ end }}
          </a>
        </li>
      {{ end }}
    </ul>
  </div>
</footer>
