{{ $page := . }}
<header class="border-b border-pine-900">
  <div class="container-site flex items-center justify-between gap-4 py-4">
    <a href="{{ site.Home.RelPermalink }}" class="font-display text-lg font-medium">{{ site.Title }}</a>
    <div class="flex items-center gap-6">
      <nav class="hidden md:block" aria-label="{{ i18n "menu" }}">
        <ul class="flex items-center gap-6 text-sm font-semibold">
          {{ range site.Menus.main }}
            <li><a href="{{ .URL }}" class="transition hover:text-coral{{ if $page.IsMenuCurrent "main" . }} text-coral{{ end }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
      {{ partial "lang-switcher.html" . }}
    </div>
  </div>
  <details class="container-site pb-3 md:hidden">
    <summary class="cursor-pointer text-sm font-semibold">{{ i18n "menu" }}</summary>
    <ul class="mt-2 grid gap-2 text-lg">
      {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} class="text-coral" aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </details>
</header>
