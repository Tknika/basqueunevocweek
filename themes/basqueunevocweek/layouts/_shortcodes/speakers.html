{{- /* Cards of the people in data/speakers.yaml. */ -}}
<ul class="grid list-none gap-4 pl-0 md:grid-cols-2">
  {{ range hugo.Data.speakers }}
    <li class="rounded-xl border-t-4 border-graphite bg-mist p-6">
      <h2 class="text-xl text-graphite">{{ .name }}</h2>
      {{ with .role }}<p class="mt-1 text-sm font-semibold text-azure">{{ . }}</p>{{ end }}
      {{ with .bio }}<p class="mt-3 text-base leading-relaxed">{{ . }}</p>{{ end }}
    </li>
  {{ end }}
</ul>
