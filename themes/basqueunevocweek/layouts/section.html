{{ define "main" }}
{{ partial "page-header.html" . }}
<div class="container-site py-12 md:py-16">
  <div class="prose-site">{{ .Content }}</div>
  <ul class="mt-10 grid gap-4 sm:grid-cols-3">
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}" class="group flex h-full items-center justify-between gap-4 rounded-xl bg-mist px-6 py-6 font-display text-2xl font-semibold transition hover:bg-azure hover:text-white">
          {{ .Title }}
          <span aria-hidden="true" class="transition group-hover:translate-x-1 motion-reduce:transition-none">→</span>
        </a>
      </li>
    {{ end }}
  </ul>
</div>
{{ end }}
