baseURL = "https://tknika.github.io/basqueunevocweek/"
title = "UNESCO-UNEVOC Anniversary Conference & Open Days 2027"
theme = "basqueunevocweek"

defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Celebrating 25 Years of UNESCO-UNEVOC and 10 Years of Tknika as a UNEVOC Centre. 11-13 May 2027, Donostia · San Sebastian."
  # Asks search engines not to index the site. Set to false when the real content is published.
  noindex = true
  # The yearly event this one belongs to, shown above the title on the home and on About, so that it reads as an annual event (asked in November 2026).
  summit = "Basque VET Annual Summit 2027"
  # subtitle: a line under the title on the home (_partials/home-hero.html); "Basque UNEVOC Week" was removed in November 2026, as asked.
  # Shown on the home page.
  dates = "11-13 May 2027"
  venue = "Donostia · San Sebastian"

  # The organisers, shown in the footer (the press area offered their logos to download until November 2026).
  # Without `logo`, the name is shown as text. The order of this list does not change the footer:
  # in the footer, `footer` places each logo: "wide" (first, as wide as the row under it), "row" (side by side, by `footer_order`) or "aside" (apart, on the right).
  # `logo` goes on the blue footer (white versions, or `plaque` for a white background).
  # The versions for white backgrounds, used by the press kit (press-kit/press-kit.html), are noted under each organiser.
  [[params.organizers]]
    name = "UNESCO-UNEVOC Network Member"
    # Apart from the rest, on the right of the footer
    footer = "aside"
    logo = "images/logo-unevoc-network.png"
    # The logo is blue: it goes on a white plaque in the blue footer.
    plaque = true
    url = "https://unevoc.unesco.org/"
  [[params.organizers]]
    name = "Basque Government, Department of Education"
    footer = "wide"
    # The Department of Education's logo (Hezkuntza Saila / Departamento de Educación under the band), in white
    logo = "images/logo-eusko-jaurlaritza-white.png"
    # In colour, for white backgrounds: images/logo-hezkuntza-saila.png, rendered from the official PDF on euskadi.eus
    # (the same file as in the euskelec site's press room). Not the plain Basque Government logo without the department:
    # it is not the right one (removed in November 2026).
    url = "https://www.euskadi.eus/"
  [[params.organizers]]
    name = "FP Euskadi"
    footer = "row"
    footer_order = 1
    logo = "images/logo-fp-euskadi.png"
    # For white backgrounds: images/logo-fp-euskadi-dark.png, a dark version made here from the white one (not official)
    url = "https://www.fpeuskadi.eus/"
  [[params.organizers]]
    name = "Tknika"
    footer = "row"
    footer_order = 2
    logo = "images/logo-tknika.png"
    # For white backgrounds: images/logo-tknika-dark.png (made here from the white one, like FP Euskadi's)
    url = "https://tknika.eus/"

[markup.goldmark.renderer]
  unsafe = true

# --- Tailwind CSS v4 (https://gohugo.io/functions/css/tailwindcss/) ---
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

[outputs]
  home = ["html"]
  section = ["html"]

# Allow the Tailwind CLI (npm package)
[security.exec]
  allow = ['^git$', '^node$', '^tailwindcss$']
