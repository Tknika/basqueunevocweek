baseURL = "https://tknika.github.io/basqueunevocweek/"
title = "UNESCO-UNEVOC Anniversary Conference & Open Days 2027"
theme = "basqueunevocweek"

defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Celebrating 25 Years of UNESCO-UNEVOC and 10 Years of Tknika as a UNEVOC Centre. 11-13 May 2027, Donostia · San Sebastian."
  # Asks search engines not to index the site. Set to false when the real content is published.
  noindex = true
  # Shown on the home page.
  dates = "11-13 May 2027"
  venue = "Donostia · San Sebastian"

  # Shown in the press area in this order. Without `logo`, the name is shown as text.
  # In the footer, `footer` places each logo: "top" (side by side, by `footer_order`), "bottom" (under them) or "aside" (apart, on the right).
  # `logo` goes on the blue footer (white versions, or `plaque` for a white background).
  # `logo_light` is an official version for light backgrounds; `logo_preview` only shows the logo on white.
  [[params.organizers]]
    name = "Basque Government, Department of Education"
    footer = "bottom"
    logo = "images/logo-eusko-jaurlaritza-white.png"
    # For light backgrounds (press area)
    logo_light = "images/logo-eusko-jaurlaritza.png"
    url = "https://www.euskadi.eus/"
  [[params.organizers]]
    name = "UNESCO-UNEVOC Network Member"
    # Apart from the rest, on the right of the footer
    footer = "aside"
    logo = "images/logo-unevoc-network.png"
    # The logo is blue: it goes on a white plaque in the blue footer.
    plaque = true
    url = "https://unevoc.unesco.org/"
  [[params.organizers]]
    name = "FP Euskadi"
    footer = "top"
    footer_order = 2
    logo = "images/logo-fp-euskadi.png"
    # Dark version made here from the white one, only to show it on white: not offered for download
    logo_preview = "images/logo-fp-euskadi-dark.png"
    url = "https://www.fpeuskadi.eus/"
  [[params.organizers]]
    name = "Tknika"
    footer = "top"
    footer_order = 1
    logo = "images/logo-tknika.png"
    logo_preview = "images/logo-tknika-dark.png"
    url = "https://tknika.eus/"

[markup.goldmark.renderer]
  unsafe = true

# --- Tailwind CSS v4 (https://gohugo.io/functions/css/tailwindcss/) ---
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

[outputs]
  home = ["html"]
  section = ["html"]

# Allow the Tailwind CLI (npm package)
[security.exec]
  allow = ['^git$', '^node$', '^tailwindcss$']
